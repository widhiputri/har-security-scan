name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run scan against sample HAR
        run: node bin/cli.js examples/sample.har --output /tmp/test-report.html

      - name: Verify report was generated
        run: test -f /tmp/test-report.html

      - name: Verify --fail-on high triggers exit code 1
        run: |
          node bin/cli.js examples/sample.har --fail-on high && exit 1 || true
